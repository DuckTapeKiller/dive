name: Release checks

# Runs ESLint and Prettier whenever you push a release tag (e.g. v2.0.4).
# If either reports any error, the workflow goes red and the tag/release is
# flagged — nothing is hidden, the errors show in the Actions log.
on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero errors required)
        run: npm run lint

      - name: Prettier (zero errors required)
        run: npm run format:check

      - name: Tests
        run: npm test
